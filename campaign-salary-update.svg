<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">अप्रैल 2025 से वेतन वृद्धि नहीं — ज़मीनी कर्मचारियों का सवाल</title>
<desc id="desc">कॉन्ट्रैक्ट कर्मचारियों की वेतन वृद्धि, वार्षिक increment और सुविधाओं की मांग का अभियान पोस्टर।</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10233f"/><stop offset="1" stop-color="#1b456b"/></linearGradient>
 <linearGradient id="gold" x2="1"><stop stop-color="#ffdf66"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
</defs>
<rect width="1200" height="760" rx="34" fill="#f7f4ec"/>
<rect x="0" y="0" width="1200" height="18" fill="#138808"/><rect x="0" y="0" width="400" height="18" fill="#ff9933"/>
<text x="600" y="100" text-anchor="middle" font-family="Noto Sans Devanagari,sans-serif" font-size="58" font-weight="800" fill="#10233f">मज़दूर संघर्ष अभियान</text>
<text x="600" y="150" text-anchor="middle" font-family="Noto Sans Devanagari,sans-serif" font-size="29" font-weight="600" fill="#536174">कर्मचारी डिजिटल मंच • वेतन वृद्धि का सवाल</text>
<rect x="42" y="190" width="1116" height="150" rx="24" fill="url(#bg)"/>
<text x="600" y="250" text-anchor="middle" font-family="Noto Sans Devanagari,sans-serif" font-size="43" font-weight="800" fill="#fff">अप्रैल 2025 से अब तक</text>
<text x="600" y="310" text-anchor="middle" font-family="Noto Sans Devanagari,sans-serif" font-size="48" font-weight="900" fill="#ffdf66">कॉन्ट्रैक्ट कर्मचारियों की सैलरी में वृद्धि नहीं</text>
<rect x="42" y="375" width="1116" height="180" rx="22" fill="#fff" stroke="#d9e0e8" stroke-width="3"/>
<circle cx="145" cy="465" r="58" fill="#e8f0f7"/><path d="M118 487 L145 416 L172 487 M128 460 H162 M121 478 H169" fill="none" stroke="#1b456b" stroke-width="9" stroke-linecap="round"/>
<text x="245" y="435" font-family="Noto Sans Devanagari,sans-serif" font-size="35" font-weight="800" fill="#10233f">ज़मीनी कर्मचारी दिन-रात बिजली व्यवस्था</text>
<text x="245" y="485" font-family="Noto Sans Devanagari,sans-serif" font-size="35" font-weight="800" fill="#10233f">और शिकायतों के समाधान में योगदान देते हैं।</text>
<text x="245" y="525" font-family="Noto Sans Devanagari,sans-serif" font-size="25" font-weight="600" fill="#667085">उनकी मेहनत के अनुरूप वेतन और सुविधाएँ कब?</text>
<rect x="42" y="590" width="1116" height="125" rx="22" fill="url(#gold)"/>
<text x="600" y="635" text-anchor="middle" font-family="Noto Sans Devanagari,sans-serif" font-size="32" font-weight="900" fill="#10233f">हमारी माँगें</text>
<text x="600" y="680" text-anchor="middle" font-family="Noto Sans Devanagari,sans-serif" font-size="28" font-weight="800" fill="#10233f">सम्मानजनक वेतन  •  वार्षिक Increment  •  उचित सुविधाएँ</text>
<text x="600" y="745" text-anchor="middle" font-family="Noto Sans Devanagari,sans-serif" font-size="20" font-weight="700" fill="#10233f">एकता ही हमारी ताकत • MAJDOOR EKTA — एक मंच, हजारों आवाज़ें!</text>
</svg>