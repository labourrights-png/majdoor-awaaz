name: Restore classic UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch platform
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('platform-v2.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://script.google.com/macros/s/AKfycbzQJiOwfYcGlz1g9BIOz22M3mjmDntF1l-zDsklvhge_PiTZcMkY_HgGUGjyFAdMNUr/exec','https://script.google.com/macros/s/AKfycbwGS_m1Rva1zmoJuCXvXFsZKkWyvXFcjwwEE4Hj5-YHX1xBm8aX838RHYE9c-Pc4_M/exec')
          for a,b in {'Digital Employee Platform':'कर्मचारी डिजिटल मंच','Join / Login':'सदस्य बनें / Login','Employee & Labour News':'कर्मचारी एवं श्रमिक समाचार','Campaign Updates':'अभियान अपडेट','Demands & Progress':'हमारी माँगें एवं प्रगति','Employee Rights':'कर्मचारी अधिकार','Campaign Dashboard':'अभियान Dashboard','Meetings & Events':'बैठकें एवं कार्यक्रम','Employee Voice':'कर्मचारी की आवाज़','My Dashboard':'मेरा Dashboard','My Participation':'मेरी सहभागिता','Suggestions / Complaints':'सुझाव / शिकायत','Publish Voice':'आवाज़ साझा करें'}.items(): s=s.replace(a,b)
          s=s.replace('<div class="stat"><b id="divisionCount">—</b><span>Divisions</span></div>','')
          s=s.replace('<input id="regDivision">','<select id="regDivision"><option value="">Division चुनें...</option><option>Alaknanda</option><option>Chhattarpur</option><option>Dwarka</option><option>Hauz Khas</option><option>Jaffarpur</option><option>Janak Puri</option><option>Khanpur</option><option>Mohan Garden</option><option>Mundka</option><option>Najafgarh</option><option>Nangloi</option><option>Nehru Place</option><option>New Friends Colony</option><option>Nizamuddin</option><option>Palam</option><option>Punjabi Bagh</option><option>R.K. Puram</option><option>Saket</option><option>Sarita Vihar</option><option>Tagore Garden</option><option>Uttam Nagar</option><option>Vasant Kunj</option><option>Vikas Puri</option></select>')
          s=s.replace('<input id="regCategory" placeholder="TO / LM / ALM / Other">','<select id="regCategory"><option value="">Category चुनें...</option><option value="TO">TO</option><option value="LM">LM</option><option value="ALM">ALM</option><option value="अन्य">अन्य</option></select>')
          if 'classic-ui.css' not in s: s=s.replace('</head>','<link rel="stylesheet" href="classic-ui.css"></head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add platform-v2.html
          git commit -m "Restore classic Hindi platform UI"
          git push
